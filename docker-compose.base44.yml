services:
  backend:
    image: node:22
    working_dir: /app/backend
    volumes:
      - ./:/app
      - backend_node_modules:/app/backend/node_modules
      - vault_data:/app/data
      - vault_uploads:/app/uploads
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    environment:
      - PORT=8000
      - DB_PATH=/app/data/vault.db
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/records').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - ./:/app
      - frontend_node_modules:/app/frontend/node_modules
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:5173"
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  backend_node_modules:
  frontend_node_modules:
  vault_data:
  vault_uploads:
